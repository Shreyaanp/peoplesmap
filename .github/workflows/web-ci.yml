name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/web-ci.yml'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  quality:
    name: Typecheck, lint, unit tests, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx -y @redocly/cli@2.69.0 lint ../api/openapi.yaml --config ../api/redocly.yaml
      - name: Generated API types match the contract
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist

  e2e:
    name: Playwright (a11y, touch targets, reduce-motion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  lighthouse:
    name: Lighthouse CI (speed budgets)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: web/dist
      - run: npm run lhci
