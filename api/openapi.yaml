openapi: 3.1.1
info:
  title: PeopleMap API
  version: 0.1.0
  summary: The contract between web/ and server/. Draft for review.
  description: |
    The only place an endpoint is defined. `web/` generates its types and typed mocks
    from this file; `server/` implements it.

    ## Conventions
    - **Auth:** Google sign-in. The browser gets a Google ID token from Google Identity
      Services and posts it to `POST /auth/google`. The server verifies it and sets an
      httpOnly session cookie. Every other endpoint needs that cookie, except the ones
      marked `security: []`.
    - **CSRF:** unsafe methods (POST, PUT, PATCH, DELETE) send the `X-XSRF-TOKEN` header,
      copied from the `XSRF-TOKEN` cookie (Spring Security's cookie CSRF repository).
    - **Profile first:** a signed-in user whose `Me.status` is `onboarding` gets
      `403 profile-required` from every map, search, people and chat endpoint.
    - **Ids** are UUIDv7. Message ids are generated by the client, so retries are safe.
    - **Errors** use RFC 9457 problem details (`application/problem+json`).
    - **Pagination** is by opaque cursor: pass `nextCursor` back as `cursor`.
    - **Time:** all timestamps are RFC 3339 UTC. Clients correct clock skew from the
      `Date` response header (used for live-tag countdowns).
    - **Privacy:** no response ever contains a person's exact location. Positions are
      the stored, snapped `publicPoint`; distances are rounded (see `Distance`).
    - **Blocking:** a person who blocked you, or whom you blocked, does not exist for
      you: they are missing from tiles, search and discovery, and their profile returns 404.
    - **Hidden from map:** a person with `hiddenFromMap` is missing from tiles, search
      and discovery; their profile still opens from an existing chat.
    - **Realtime** (STOMP over WebSocket) is described in `api/realtime.md`. It only
      hints; these REST endpoints are the truth.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot
security:
  - session: []

tags:
  - name: auth
    description: Sign in, sign out, development login.
  - name: me
    description: The signed-in person's own profile, location, settings and account.
  - name: tags
    description: Tag suggestions, extraction from a sentence and related tags.
  - name: map
    description: Tile-based glows and people for the map.
  - name: discover
    description: The default peek of people around you, before any search.
  - name: search
    description: Hashtag and natural-language search.
  - name: people
    description: Profiles and "more like this person".
  - name: connections
    description: One-way connections (follow).
  - name: chat
    description: Threads in Chats and Glows, and messages.
  - name: safety
    description: Blocking and reporting.

paths:
  # ───────────────────────── auth ─────────────────────────
  /auth/google:
    post:
      tags: [auth]
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a session
      description: |
        Creates the account on first sign-in (with `status: onboarding`).
        Sets the `SESSION` and `XSRF-TOKEN` cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: The ID token (JWT) returned by Google Identity Services.
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/dev:
    post:
      tags: [auth]
      operationId: signInAsDevUser
      summary: Development-only login as a seeded person
      description: |
        Exists only when the server runs with the `local` profile. Returns 404 in
        every other environment. Lets you pick any seeded person without Google.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: { type: string, format: uuid }
      responses:
        '200':
          description: Signed in as that person.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the session
      responses:
        '204': { description: Signed out; cookies cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── me ─────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in person
      description: The app calls this at boot. 401 means show the sign-in screen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      operationId: deleteAccount
      summary: Delete my account and data (DPDP Act right to erasure)
      description: |
        Removes the person, private location, photo, tags, embeddings, connections,
        search events and blocks. Messages follow the erasure policy in the Build Plan.
        Irreversible; the client asks for confirmation by typed word, not a dialog.
      responses:
        '204': { description: Deleted; session ended. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile:
    put:
      tags: [me]
      operationId: saveProfile
      summary: Create or update my profile
      description: |
        The final onboarding step. When it succeeds for an `onboarding` person, they
        become `active` and appear on the map (unless `hiddenFromMap`).
        Location must already be set (`PUT /me/location`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '409':
          description: Location not set yet.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/location:
    put:
      tags: [me]
      operationId: setLocation
      summary: Set my location
      description: |
        The exact point is stored privately and never returned. The server derives and
        stores `publicPoint` once (snapped to H3 resolution 8 for `neighbourhood`, 10 for
        `exact`, plus a fixed jitter). Returns 422 `outside-launch-area` outside Hyderabad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point, mode]
              properties:
                point: { $ref: '#/components/schemas/LatLng' }
                mode: { $ref: '#/components/schemas/LocationMode' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyLocation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/photo:
    put:
      tags: [me]
      operationId: uploadPhoto
      summary: Upload or replace my photo
      description: |
        JPEG, PNG, WebP or HEIC, at most 10 MB. The server strips metadata (including
        GPS), crops square, makes the sizes and the ThumbHash. Until processing ends,
        `photo.state` is `processing` and the generated aura is shown.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Accepted for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [me]
      operationId: deletePhoto
      summary: Remove my photo (back to the generated aura)
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/tags:
    put:
      tags: [me]
      operationId: replaceMyTags
      summary: Replace my tag list
      description: Order is rank; the first three show on map pins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/TagInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonTag' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/live-tags:
    post:
      tags: [me]
      operationId: addLiveTag
      summary: Add a "right now" tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, duration]
              properties:
                tag: { type: string, minLength: 2, maxLength: 40 }
                duration: { $ref: '#/components/schemas/LiveTagDuration' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTag' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/live-tags/{liveTagId}:
    parameters:
      - $ref: '#/components/parameters/LiveTagId'
    delete:
      tags: [me]
      operationId: endLiveTag
      summary: End a live tag early
      responses:
        '204': { description: Ended. }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/settings:
    patch:
      tags: [me]
      operationId: updateSettings
      summary: Change my settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/push-subscription:
    put:
      tags: [me]
      operationId: savePushSubscription
      summary: Register this device for Web Push (later phase)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscription' }
      responses:
        '204': { description: Saved. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      operationId: deletePushSubscription
      summary: Stop Web Push on this device
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/inbox-summary:
    get:
      tags: [chat]
      operationId: getInboxSummary
      summary: Unread counts for the Chats and Glows badges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── tags ─────────────────────────
  /tags/extract:
    post:
      tags: [tags]
      operationId: extractTags
      summary: Turn "describe yourself" into suggested tags
      description: |
        Drives Tag Birth. `spans` give each tag's character range in the sentence so the
        words can lift off from where they were typed. Also used to edit later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sentence]
              properties:
                sentence: { type: string, minLength: 3, maxLength: 280 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items: { $ref: '#/components/schemas/ExtractedTag' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /tags/suggest:
    get:
      tags: [tags]
      operationId: suggestTags
      summary: Tag suggestions while typing, with local counts
      description: 'Feeds the dropdown: "#badminton · 340 near Gachibowli".'
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
        - $ref: '#/components/parameters/Near'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/TagSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tags/{slug}/related:
    get:
      tags: [tags]
      operationId: getRelatedTags
      summary: Related tags, for the Ripple
      parameters:
        - $ref: '#/components/parameters/TagSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [related]
                properties:
                  related:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/RelatedTag' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── map ─────────────────────────
  /public/city-glow:
    get:
      tags: [map]
      operationId: getCityGlow
      summary: Coarse glow for the sign-in screen
      description: |
        The living amber map behind the sign-in button. H3 resolution 6 counts only,
        no tags, no people, cells under the minimum merged. Public and CDN-cacheable.
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=600' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlowTile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /glows/{z}/{x}/{y}:
    get:
      tags: [map]
      operationId: getGlowTile
      summary: Glow cells for one map tile (far zoom)
      description: |
        H3 counts only, never individual people. Cell resolution follows the tile zoom
        (z ≤ 9 → r6, 10–11 → r7, 12 → r8). Cells with fewer than about 5 people merge
        into a neighbour. With `tags`, counts are of matching people and related-tag
        counts come back separately for the Ripple.
      parameters:
        - $ref: '#/components/parameters/TileZ'
        - $ref: '#/components/parameters/TileX'
        - $ref: '#/components/parameters/TileY'
        - $ref: '#/components/parameters/TagFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlowTile' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /people/tiles/{z}/{x}/{y}:
    get:
      tags: [map]
      operationId: getPeopleTile
      summary: People in one map tile (mid and close zoom)
      description: |
        Only for z ≥ 13. Positions are public points. Excludes blocked and hidden
        people, so it is per-user and not CDN-cacheable.
      parameters:
        - $ref: '#/components/parameters/TileZ'
        - $ref: '#/components/parameters/TileX'
        - $ref: '#/components/parameters/TileY'
        - $ref: '#/components/parameters/TagFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeopleTile' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ───────────────────────── discover & search ─────────────────────────
  /discover:
    get:
      tags: [discover]
      operationId: discoverNearby
      summary: The default peek - people around you with different interests
      description: |
        What the sheet shows before any search. Ranked for nearness and for variety of
        interests (no two neighbours in the list lead with the same tag).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonCardPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Hashtag or natural-language search
      description: |
        Returns how the query was understood plus the ranked list for the sheet. The
        client then refetches glow and people tiles with `tags=` set to the matched
        canonical slugs, so the same map shows only the filtered people.
        Fewer than about 3 results nearby → `nearest` says where to fly.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          example: someone to trek with this weekend near gachibowli
        - name: bbox
          in: query
          description: '"Search this area": west,south,east,north. Omitted → around me.'
          schema: { type: string, pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ───────────────────────── people ─────────────────────────
  /people/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [people]
      operationId: getProfile
      summary: A person's profile card
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/similar:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [people]
      operationId: getSimilarPeople
      summary: More like this person
      description: Excludes the person, me and people I already connect to.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonCardPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── connections ─────────────────────────
  /connections/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    put:
      tags: [connections]
      operationId: connect
      summary: Connect (one-way, idempotent)
      description: If a thread with them sits in my Glows, it moves to my Chats.
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionState' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connections]
      operationId: disconnect
      summary: Remove my connection (idempotent)
      description: Existing threads stay in Chats.
      responses:
        '200':
          description: Disconnected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: People I connect to, or who connect to me
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [following, followers] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonCardPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── chat ─────────────────────────
  /threads:
    get:
      tags: [chat]
      operationId: listThreads
      summary: My threads in one folder, newest activity first
      parameters:
        - name: folder
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Folder' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ThreadSummary' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [chat]
      operationId: startThread
      summary: Send a first message to someone
      description: |
        One thread per pair. If it already exists the message is added to it and the
        existing thread is returned with 200. For the recipient it lands in Chats if
        they connect to me, otherwise in Glows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, message]
              properties:
                recipientId: { type: string, format: uuid }
                message: { $ref: '#/components/schemas/MessageInput' }
      responses:
        '200':
          description: Existing thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadWithMessage' }
        '201':
          description: New thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadWithMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /threads/{threadId}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [chat]
      operationId: getThread
      summary: One thread's summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /threads/{threadId}/messages:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [chat]
      operationId: listMessages
      summary: Messages, for history and catch-up
      description: |
        `after` is the catch-up call made on every reconnect (oldest first).
        `before` pages back through history (newest first). Never both.
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      operationId: sendMessage
      summary: Send a message (idempotent on the client-generated id)
      description: |
        Replying to a thread in my Glows moves it to my Chats.
        Resending the same id returns the stored message with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageInput' }
      responses:
        '200':
          description: Already stored (retry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /threads/{threadId}/read:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    post:
      tags: [chat]
      operationId: markRead
      summary: Mark the thread read up to a message
      description: The sender sees read receipts only when the thread is in my Chats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid }
      responses:
        '204': { description: Saved. }
        '404': { $ref: '#/components/responses/NotFound' }

  /threads/{threadId}/accept:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    post:
      tags: [chat]
      operationId: acceptGlow
      summary: Accept a Glow - move it to my Chats without replying
      responses:
        '200':
          description: Moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /threads/{threadId}/ignore:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    post:
      tags: [chat]
      operationId: ignoreGlow
      summary: Ignore a Glow
      description: |
        Hides the thread from my Glows. The sender is never told; their later messages
        are stored but never notify me or resurface the thread. Undo with DELETE.
      responses:
        '204': { description: Ignored. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [chat]
      operationId: unignoreGlow
      summary: Undo ignore (the "Undo" in the toast)
      responses:
        '200':
          description: Back in Glows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── safety ─────────────────────────
  /blocks/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    put:
      tags: [safety]
      operationId: block
      summary: Block a person (idempotent)
      description: |
        Removes connections both ways and hides our thread from me. Each of us disappears
        from the other's map, search and discovery. They are not told.
      responses:
        '204': { description: Blocked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [safety]
      operationId: unblock
      summary: Unblock a person (idempotent)
      description: Connections removed by the block are not restored.
      responses:
        '204': { description: Unblocked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/blocks:
    get:
      tags: [safety]
      operationId: listBlocks
      summary: People I have blocked
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonMini' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports:
    post:
      tags: [safety]
      operationId: report
      summary: Report a person or a message
      description: Optionally blocks them in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '202': { description: Received. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: httpOnly, Secure (outside local), SameSite=Lax session cookie.

  parameters:
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LiveTagId:
      name: liveTagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagSlug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TagSlug' }
    TileZ:
      name: z
      in: path
      required: true
      schema: { type: integer, minimum: 0, maximum: 16 }
    TileX:
      name: x
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
    TileY:
      name: y
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
    TagFilter:
      name: tags
      in: query
      description: Comma-separated canonical tag slugs. Omitted → everyone.
      schema: { type: string, maxLength: 200, example: 'badminton,trekking' }
    Near:
      name: near
      in: query
      description: 'lat,lng to count around. Omitted → around my public point.'
      schema: { type: string, pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No valid session, or the Google token was rejected.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Missing, or hidden from you (blocked).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Invalid input; see `errors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          schema: { type: integer, description: Seconds. }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ─── shared ───
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: '/problems/<code>, e.g. /problems/profile-required'
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine code the client switches on.
          enum:
            - bad-request
            - unauthorized
            - profile-required
            - not-found
            - validation-failed
            - outside-launch-area
            - location-required
            - rate-limited
            - internal
        errors:
          type: array
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer: { type: string, description: JSON Pointer to the bad field. }
              message: { type: string }
    NextCursor:
      type: [string, 'null']
      description: Null when there are no more pages.
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    H3Cell:
      type: string
      pattern: '^[0-9a-f]{15}$'
      description: H3 index as lowercase hex.
    Distance:
      type: object
      description: |
        Rounded on the server from public points. Display as "under 1 km" when `under`,
        otherwise "~{km} km".
      required: [km, under]
      properties:
        km:
          type: integer
          minimum: 1
          description: 1–10 exact kilometres, then rounded to the nearest 5.
        under: { type: boolean, description: True only for "under 1 km". }
    Activity:
      type: [string, 'null']
      enum: [today, this_week, null]
      description: Never "online now".

    # ─── tags ───
    TagSlug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
    TagLevel:
      type: string
      enum: [learning, doing, teaching]
    TagRef:
      type: object
      description: A tag as a person spelled it, plus the canonical tag it matches on.
      required: [display, slug]
      properties:
        display: { type: string, description: 'Spelling shown, without "#".' }
        slug: { $ref: '#/components/schemas/TagSlug' }
    PersonTag:
      allOf:
        - $ref: '#/components/schemas/TagRef'
        - type: object
          required: [level]
          properties:
            level: { $ref: '#/components/schemas/TagLevel' }
    ProfileTag:
      allOf:
        - $ref: '#/components/schemas/PersonTag'
        - type: object
          required: [shared]
          properties:
            shared: { type: boolean, description: I have this tag too (glows amber). }
    TagInput:
      type: object
      required: [display, level]
      properties:
        display: { type: string, minLength: 2, maxLength: 40 }
        level: { $ref: '#/components/schemas/TagLevel' }
    ExtractedTag:
      allOf:
        - $ref: '#/components/schemas/PersonTag'
        - type: object
          required: [spans, isNew]
          properties:
            spans:
              type: array
              description: '[start, end) character ranges in the sentence.'
              items:
                type: array
                prefixItems:
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                minItems: 2
                maxItems: 2
            isNew: { type: boolean, description: Not in the vocabulary yet. }
    TagSuggestion:
      allOf:
        - $ref: '#/components/schemas/TagRef'
        - type: object
          required: [countNearby]
          properties:
            countNearby: { type: integer, minimum: 0 }
            nearLabel:
              type: string
              description: Locality name for "· 340 near Gachibowli".
    RelatedTag:
      allOf:
        - $ref: '#/components/schemas/TagRef'
        - type: object
          required: [strength]
          properties:
            strength: { type: number, minimum: 0, maximum: 1 }
    LiveTagDuration:
      type: string
      enum: [1h, 3h, tonight, 24h]
    LiveTag:
      type: object
      required: [id, display, slug, startsAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        display: { type: string }
        slug: { $ref: '#/components/schemas/TagSlug' }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    # ─── people ───
    Photo:
      type: object
      required: [state, thumbhash]
      properties:
        state: { type: string, enum: [processing, ready, failed] }
        thumbhash:
          type: [string, 'null']
          description: Base64 ThumbHash, shown while the image loads.
        small: { type: string, format: uri, description: 96px square. }
        medium: { type: string, format: uri, description: 320px square. }
        large: { type: string, format: uri, description: 720px square. }
    PersonMini:
      type: object
      description: |
        Enough to draw a name and avatar. With no photo, the client draws the generated
        aura seeded from `id`.
      required: [id, displayName, photo]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        photo:
          oneOf:
            - $ref: '#/components/schemas/Photo'
            - type: 'null'
    PersonPin:
      type: object
      description: One person on the map.
      required: [id, point, topTags, photo]
      properties:
        id: { type: string, format: uuid }
        point: { $ref: '#/components/schemas/LatLng' }
        topTags:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/TagRef' }
        matched:
          type: array
          description: With a tag filter, the canonical slugs this person matched.
          items: { $ref: '#/components/schemas/TagSlug' }
        photo:
          oneOf:
            - $ref: '#/components/schemas/Photo'
            - type: 'null'
        liveTag:
          oneOf:
            - $ref: '#/components/schemas/LiveTag'
            - type: 'null'
    PersonCard:
      allOf:
        - $ref: '#/components/schemas/PersonMini'
        - type: object
          description: One row in the results sheet.
          required: [locality, topTags, distance, point]
          properties:
            locality: { type: string, example: Gachibowli }
            point: { $ref: '#/components/schemas/LatLng' }
            topTags:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/ProfileTag' }
            liveTag:
              oneOf:
                - $ref: '#/components/schemas/LiveTag'
                - type: 'null'
            distance: { $ref: '#/components/schemas/Distance' }
            activity: { $ref: '#/components/schemas/Activity' }
    PersonCardPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonCard' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    Profile:
      allOf:
        - $ref: '#/components/schemas/PersonMini'
        - type: object
          required: [locality, point, tags, liveTags, distance, connection]
          properties:
            locality: { type: string }
            point: { $ref: '#/components/schemas/LatLng' }
            sentence: { type: [string, 'null'] }
            tags:
              type: array
              items: { $ref: '#/components/schemas/ProfileTag' }
            liveTags:
              type: array
              items: { $ref: '#/components/schemas/LiveTag' }
            distance: { $ref: '#/components/schemas/Distance' }
            activity: { $ref: '#/components/schemas/Activity' }
            connection: { $ref: '#/components/schemas/ConnectionState' }
            threadId:
              type: [string, 'null']
              format: uuid
              description: Our existing thread, if any.
    ConnectionState:
      type: object
      required: [iConnect, connectsToMe]
      properties:
        iConnect: { type: boolean }
        connectsToMe: { type: boolean }

    # ─── me ───
    LocationMode:
      type: string
      enum: [exact, neighbourhood]
      description: exact snaps to about 100m, neighbourhood to about 500m.
    MyLocation:
      type: object
      required: [mode, publicPoint, locality]
      properties:
        mode: { $ref: '#/components/schemas/LocationMode' }
        publicPoint:
          $ref: '#/components/schemas/LatLng'
          description: Where others see me. Never the exact point.
        locality: { type: string }
    ProfileInput:
      type: object
      required: [displayName, tags]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        sentence: { type: string, maxLength: 280 }
        tags:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/TagInput' }
    Settings:
      type: object
      required: [hiddenFromMap, notifyChats, notifyGlows]
      properties:
        hiddenFromMap:
          type: boolean
          description: Off the map, search and discovery. Chats keep working.
        notifyChats: { type: boolean }
        notifyGlows: { type: boolean }
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        hiddenFromMap: { type: boolean }
        notifyChats: { type: boolean }
        notifyGlows: { type: boolean }
    PushSubscription:
      type: object
      description: The browser's PushSubscription.toJSON().
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
    Me:
      type: object
      required: [id, status, email, displayName, photo, tags, liveTags, location, settings]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [onboarding, active]
          description: onboarding → the app shows onboarding instead of the map.
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        sentence: { type: [string, 'null'] }
        photo:
          oneOf:
            - $ref: '#/components/schemas/Photo'
            - type: 'null'
        tags:
          type: array
          items: { $ref: '#/components/schemas/PersonTag' }
        liveTags:
          type: array
          items: { $ref: '#/components/schemas/LiveTag' }
        location:
          oneOf:
            - $ref: '#/components/schemas/MyLocation'
            - type: 'null'
        settings: { $ref: '#/components/schemas/Settings' }

    # ─── map ───
    GlowCell:
      type: object
      required: [cell, count]
      properties:
        cell: { $ref: '#/components/schemas/H3Cell' }
        count:
          type: integer
          minimum: 5
          description: People (or matching people) in the cell. Drives brightness.
        relatedCount:
          type: integer
          minimum: 0
          description: With a tag filter, people matching only related tags (the Ripple).
    GlowTile:
      type: object
      required: [resolution, cells]
      properties:
        resolution: { type: integer, enum: [6, 7, 8] }
        cells:
          type: array
          items: { $ref: '#/components/schemas/GlowCell' }
    PeopleTile:
      type: object
      required: [people]
      properties:
        people:
          type: array
          items: { $ref: '#/components/schemas/PersonPin' }

    # ─── search ───
    ParsedQuery:
      type: object
      description: How the query was understood. Drives glow highlights and the Ripple.
      required: [tags, related]
      properties:
        tags:
          type: array
          description: Matched canonical tags (glow highlight; pass to tile `tags=`).
          items: { $ref: '#/components/schemas/TagRef' }
        related:
          type: array
          description: Related tags, glowing fainter a beat later.
          items: { $ref: '#/components/schemas/TagRef' }
        level:
          oneOf:
            - $ref: '#/components/schemas/TagLevel'
            - type: 'null'
          description: Set when the query asks to learn or teach.
        area:
          type: [object, 'null']
          required: [name, center]
          properties:
            name: { type: string, example: Gachibowli }
            center: { $ref: '#/components/schemas/LatLng' }
        timeWindow:
          type: [object, 'null']
          required: [from, to, label]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            label: { type: string, example: this weekend }
    NearestCluster:
      type: object
      description: Never a dead end. Where the client flies when results are thin.
      required: [center, count, locality]
      properties:
        center: { $ref: '#/components/schemas/LatLng' }
        count: { type: integer, minimum: 1 }
        locality: { type: string }
    SearchResult:
      type: object
      required: [query, items]
      properties:
        query: { $ref: '#/components/schemas/ParsedQuery' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonCard' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
        nearest:
          oneOf:
            - $ref: '#/components/schemas/NearestCluster'
            - type: 'null'

    # ─── chat ───
    Folder:
      type: string
      enum: [chats, glows]
    MessageInput:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 generated on the client; makes retries safe.
        body: { type: string, minLength: 1, maxLength: 2000 }
    Message:
      type: object
      required: [id, threadId, senderId, body, sentAt]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        body: { type: string }
        sentAt: { type: string, format: date-time }
    ThreadSummary:
      type: object
      required: [id, folder, other, lastMessage, unreadCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        folder: { $ref: '#/components/schemas/Folder' }
        other: { $ref: '#/components/schemas/PersonMini' }
        sharedTags:
          type: array
          description: Shown on Glows so a stranger's message has context.
          items: { $ref: '#/components/schemas/TagRef' }
        lastMessage: { $ref: '#/components/schemas/Message' }
        unreadCount: { type: integer, minimum: 0 }
        otherReadUpTo:
          type: [string, 'null']
          format: uuid
          description: Read receipt. Always null unless the thread is in their Chats.
        updatedAt: { type: string, format: date-time }
    ThreadWithMessage:
      type: object
      required: [thread, message]
      properties:
        thread: { $ref: '#/components/schemas/ThreadSummary' }
        message: { $ref: '#/components/schemas/Message' }
    InboxSummary:
      type: object
      required: [chatsUnread, glowsUnread]
      properties:
        chatsUnread: { type: integer, minimum: 0 }
        glowsUnread: { type: integer, minimum: 0 }

    # ─── safety ───
    ReportInput:
      type: object
      required: [subject, reason]
      properties:
        subject:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, enum: [person, message] }
            id: { type: string, format: uuid }
        reason:
          type: string
          enum: [fake_profile, harassment, spam, inappropriate_photo, underage, unsafe, other]
        note: { type: string, maxLength: 500 }
        alsoBlock: { type: boolean, default: true }
